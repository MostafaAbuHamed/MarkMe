name: Deploy preview API

on:
  push:
    branches: [main]
    paths:
      - apps/preview-api/**
      - packages/domain/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-preview-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_REGION: europe-west1
      SERVICE_NAME: markme-preview-api
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/markme/preview-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push preview API image
        run: |
          set -euo pipefail
          docker build -f apps/preview-api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --max-instances=1 \
            --min-instances=0 \
            --memory=256Mi \
            --allow-unauthenticated \
            --service-account "${{ vars.PREVIEW_API_RUNTIME_SA }}" \
            --set-env-vars "SUPABASE_URL=${{ vars.PREVIEW_API_SUPABASE_URL }}" \
            --quiet

      - name: Smoke test deployed service
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format='value(status.url)')
          curl -fsS "$URL/healthz"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$URL/v1/preview" \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}')
          if [ "$code" != "401" ]; then
            echo "Expected POST /v1/preview without token to return 401, got $code"
            exit 1
          fi
