name: Deploy preview API

on:
  push:
    branches: [main]
    paths:
      - apps/preview-api/**
      - packages/domain/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PREVIEW_API_URL: ${{ vars.PREVIEW_API_URL }}
    steps:
      - name: Allow main and milestone branches only
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/(main|[0-9]{3}-.+)$ ]]; then
            echo "Deploys run from main or a NNN-* milestone branch, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @markme/preview-api...

      - name: Build prebuilt Vercel function
        env:
          SUPABASE_URL: ${{ vars.PREVIEW_API_SUPABASE_URL }}
          CORS_ORIGINS: ${{ vars.PREVIEW_API_CORS_ORIGINS }}
        run: |
          set -euo pipefail
          pnpm --filter @markme/preview-api build
          node apps/preview-api/scripts/vercel-output.mjs

      - name: Deploy to Vercel
        working-directory: apps/preview-api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Smoke test deployed service
        run: |
          set -euo pipefail
          curl -fsS "$PREVIEW_API_URL/healthz"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$PREVIEW_API_URL/v1/preview" \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}')
          if [ "$code" != "401" ]; then
            echo "Expected POST /v1/preview without token to return 401, got $code"
            exit 1
          fi
